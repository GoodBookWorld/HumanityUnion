<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0174b0" />
    <title>Offline | Humanity Union</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fa;
        --text: #1a2b3c;
        --muted: #5a6b7c;
        --brand: #0174b0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        min-height: 2.75rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline.</h1>
      <p>
        Some public content may still be available. Connect to the internet to continue working with
        Workspace, Messages and collaboration tools.
      </p>
      <button type="button" onclick="location.reload()">Try Again</button>
    </main>
  </body>
</html>
