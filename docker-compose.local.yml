# Local development compose with optional MongoDB container.
# Use alongside normal `pnpm dev`, or run API/web in containers against local Mongo.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - humanity_union_mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/humanity_union_dev
      MONGODB_DATABASE: humanity_union_dev
      JWT_ACCESS_SECRET: dev-jwt-access-secret-change-before-production
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-change-before-production
      AUTH_BOOTSTRAP_FALLBACK: "true"
      CORS_ORIGIN: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      NOTIFICATION_PERSISTENCE: memory
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  humanity_union_mongo_data:
